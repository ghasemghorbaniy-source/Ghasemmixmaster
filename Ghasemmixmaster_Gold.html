<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>www.Ghasemmixmaster</title>
<style>
*{box-sizing:border-box}:root{--gold:#e7bd55;--gold2:#fff0a8;--black:#050505}
body{margin:0;background:radial-gradient(ellipse at 50% 25%,#28200d 0%,#0a0a0a 45%,#000 100%);color:#eee;font-family:Tahoma,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 20%,#d6a83b09 48%,transparent 65%)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 5%;border-bottom:1px solid #8e6c241f}
.brand{font-weight:900;color:var(--gold);letter-spacing:1px;font-size:19px;text-shadow:0 0 16px #d9a83a44}
nav{display:flex;gap:20px;font-size:14px}nav a{color:#cfcfcf;text-decoration:none}nav a:hover{color:var(--gold)}
main{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 18px 60px}
.logo{width:min(360px,76vw);height:auto;max-height:360px;object-fit:contain;border-radius:50%;filter:drop-shadow(0 0 22px #d9a83a24);margin:0 auto 8px}
h1{font-size:clamp(22px,5vw,36px);margin:8px 0;color:var(--gold2);text-shadow:0 0 20px #b78b2b30} h1 span{color:var(--gold)}
.sub{color:#aaa;margin:5px 0 26px}
.search{display:flex;align-items:center;width:min(700px,95vw);border:1px solid #a17c2e77;background:#101010;border-radius:40px;padding:7px 15px;box-shadow:0 0 30px #d0a13712;transition:.25s}
.search:focus-within{border-color:var(--gold);box-shadow:0 0 25px #d0a13730}
.search input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:white;font-size:16px;padding:12px;font-family:inherit}
.search button{border:0;background:transparent;color:var(--gold);font-size:20px;cursor:pointer}
.actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:24px 0}
.btn{border:1px solid #8d6c2c;background:linear-gradient(135deg,#241b09,#0e0e0e);color:#f2d27b;border-radius:10px;padding:12px 20px;cursor:pointer;font-family:inherit;text-decoration:none;transition:.2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 18px #c69b3a30;border-color:var(--gold)}
.quick{display:grid;grid-template-columns:repeat(4,minmax(90px,130px));gap:12px;margin:26px auto 10px}
.quick a{text-decoration:none;color:#ddd;background:#121212;border:1px solid #333;border-radius:13px;padding:16px 10px;transition:.2s}
.quick a:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-3px)}
.quick .ico{display:block;font-size:24px;margin-bottom:8px}
.tagline{margin-top:45px;color:#777;font-size:13px}.tagline b{color:var(--gold)}
footer{border-top:1px solid #8e6c241f;padding:18px;text-align:center;color:#777;font-size:12px}footer strong{color:var(--gold)}
@media(max-width:520px){header{justify-content:center;flex-wrap:wrap;gap:12px}nav{gap:14px}.quick{grid-template-columns:repeat(2,minmax(110px,140px))}}
</style></head>
